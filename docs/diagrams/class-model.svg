ng" textLength="159.0942" x="583.5" y="458.0151">belong to the same Event.</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="93" id="ent0023"><path d="M338.5,749 L338.5,812.118 A0,0 0 0 0 338.5,812.118 L650.4793,812.118 A0,0 0 0 0 650.4793,812.118 L650.4793,759 L640.4793,749 L497.02,749 L489.25,670.3 L489.02,749 L338.5,749 A0,0 0 0 0 338.5,749" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M640.4793,749 L640.4793,759 L650.4793,759 L640.4793,749" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.9793" x="344.5" y="767.897">Owns its lifecycle (VALID -&gt; USED / CANCELLED).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.5682" x="344.5" y="785.603">Issued by OrderItem but never deleted with it:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.7502" x="344.5" y="803.309">refunds transition to CANCELLED.</text></g><!--reverse link Event to TicketType--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="composition" data-source-line="74" id="lnk11"><path codeLine="74" d="M164.0238,330.0098 C163.6738,393.4098 163.26,471.31 162.91,534.77" fill="none" id="Event-backto-TicketType" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="164.09,318.01,160.0569,323.9878,164.0238,330.0098,168.0568,324.032,164.09,318.01" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.811" x="117.9156" y="340.3391">1 event</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.6131" x="65.4069" y="523.2427">0..* ticketTypes</text></g><!--link User to Order--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data