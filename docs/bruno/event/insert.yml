info:
  name: insert
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/events"
  body:
    type: json
    data: |-
      {
        "name": "Event Name",
        "description": "Event Description",
        "startsAt": "{{startsAt}}",
        "endsAt": "{{endsAt}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("startsAt", new Date(Date.now() + 30 * 864e5).toISOString());
        bru.setVar("endsAt", new Date(Date.now() + 32 * 864e5).toISOString());
    - type: after-response
      code: bru.setVar("eventId", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
