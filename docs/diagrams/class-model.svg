"sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.2958" x="423" y="595.4659">UUID id</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.7697" x="423" y="614.5339">UUID code</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.2135" x="423" y="633.6018">TicketStatus status</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.2216" x="423" y="652.6697">Instant usedAt</text></g><!--class TicketStatus--><g class="entity" data-qualified-name="TicketStatus" data-source-line="66" id="ent0010"><rect fill="#F1F1F1" height="97.2038" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="111.5477" x="269.5" y="554"/><ellipse cx="284.5" cy="570" fill="#EB937F" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M288.6094,576 L280.8906,576 L280.8906,563.6094 L288.6094,563.6094 L288.6094,565.7656 L283.3438,565.7656 L283.3438,568.4375 L288.1094,568.4375 L288.1094,570.5938 L283.3438,570.5938 L283.3438,573.8438 L288.6094,573.8438 L288.6094,576 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79.5477" x="298.5" y="575.432">TicketStatus</text><line style="stroke:#181818;stroke-width:0.5;" x1="270.5" x2="380.0477" y1="586" y2="586"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6478" x="275.5" y="604.9659">VALID</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.9239" x="275.5" y="624.0339">USED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.7417" x="275.5" y="643.1018">CANCELLED</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="79" id="ent0017"><path d="M6,730 L6,810.8241 A0,0 0 0 0 6,810.8241 L300.5202,810.8241 A0,0 0 0 0 300.5202,810.8241 L300.5202,740 L290.5202,730 L159.18,730 L157.69,670.06 L151.18,730 L6,730 A0,0 0 0 0 6,730" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M290.5202,730 L290.5202,740 L300.5202,740 L290.5202,730" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.2242" x="12" y="748.897">Stock is read with a pessimistic write lock</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.5202" x="12" y="766.603">during reservation, so concurrent buyers are</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.0031" x="12" y="784.309">serialized on this row.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.0072" x="12" y="802.0151">availableQuantity is the source of truth.</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="86" id="ent0020"><path d="M575.5,386 L575.5,466.8241 A0,0 0 0 0 575.5,466.8241 L847.1272,466.8241 A0,0 0 0 0 847.1272,466.8241 L847.1272,396 L837.1272,386 L700.81,386 L671.75,318.23 L692.81,386 L575.5,386 A0,0 0 0 0 575.5,386" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M837.1272,386 L837.1272,396 L847.1272,396 L837.1272,386" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.6272" x="581.5" y="404.897">PENDING holds stock until reservedUntil;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.7132" x="581.5" y="422.603">expired reservations release it back.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.1602" x="581.5" y="440.309">Invariant: all items in an Order</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.0942" x="581.5" y="458.0151">belong to the same Event.</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="93" id="ent0023"><path d="M336.5,739 L336.5,802.118 A0,0 0 0 0 336.5,802.118 L648.4793,802.118 A0,0 0 0 0 648.4793,802.118 L648.4793,749 L638.4793,739 L495.02,739 L487.25,660.63 L487.02,739 L336.5,739 A0,0 0 0 0 336.5,739" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M638.4793,739 L638.4793,749 L648.4793,749 L638.4793,739" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.9793" x="342.5" y="757.897">Owns its lifecycle (VALID -&gt; USED / CANCELLED).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.5682" x="342.5" y="775.603">Issued by OrderItem but never deleted with it:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.7502" x="342.5" y="793.309">refunds transition to CANCELLED.</text></g><!--reverse link Event to TicketType--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="composition" data-source-line="73" id="lnk11"><path codeLine="73" d="M162.0127,330.2398 C161.6527,394.4398 161.21,473.37 160.87,534.74" fill="none" id="Event-backto-TicketType" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="162.08,318.24,158.0464,324.2175,162.0127,330.2398,166.0463,324.2623,162.08,318.24" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.811" x="115.9737" y="340.3233">1 event</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.6131" x="62.8621" y="523.3161">0..* ticketTypes</text></g><!--link User to Order--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-l