info:
  name: update
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/events/{{eventId}}"
  body:
    type: json
    data: |-
      {
        "name": "Updated event name",
        "description": "Updated Event description",
        "startsAt": "{{startsAt}}",
        "endsAt": "{{endsAt}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("startsAt", new Date(Date.now() + 30 * 864e5).toISOString());
        bru.setVar("endsAt", new Date(Date.now() + 32 * 864e5).toISOString());

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
