# Event
event.name.blank=event name must not be blank
event.name.required=event name is required
event.name.length=event name must be at most {max} characters
event.description.blank=event description must not be blank
event.description.required=event description is required
event.description.length=event description must be at most {max} characters
event.startsAt.required=event startsAt is required
event.startsAt.future=event startsAt must be in the present or future
event.endsAt.required=event endsAt is required
event.endsAt.future=event endsAt must be in the present or future
event.period.invalid=event endsAt must be after startsAt

## Ticket type
ticket-type.name.required=ticket type name is required
ticket-type.name.length=ticket type name must be at most {max} characters
ticket-type.description.required=ticket type description is required
ticket-type.description.length=ticket type description must be at most {max} characters
ticket-type.price.required=ticket type price is required
ticket-type.price.positive-or-zero=ticket type price must be 0 or greater
ticket-type.total-quantity.required=ticket type total quantity is required
ticket-type.total-quantity.positive=ticket type total quantity must be greater than 0
ticket-type.quantity.required=ticket type quantity is required
ticket-type.quantity.positive=ticket type quantity must be greater than 0
