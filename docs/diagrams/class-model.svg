Length="38.5418" x="486.5694" y="584.932">Ticket</text><line style="stroke:#181818;stroke-width:0.5;" x1="423" x2="556.2135" y1="595.5" y2="595.5"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.2958" x="428" y="614.4659">UUID id</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="70.7697" x="428" y="633.5339">UUID code</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.2135" x="428" y="652.6018">TicketStatus status</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.2216" x="428" y="671.6697">Instant usedAt</text></g><!--class TicketStatus--><g class="entity" data-qualified-name="TicketStatus" data-source-line="67" id="ent0010"><rect fill="#F1F1F1" height="97.2038" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="111.5477" x="274.5" y="573"/><ellipse cx="289.5" cy="589" fill="#EB937F" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M293.6094,595 L285.8906,595 L285.8906,582.6094 L293.6094,582.6094 L293.6094,584.7656 L288.3438,584.7656 L288.3438,587.4375 L293.1094,587.4375 L293.1094,589.5938 L288.3438,589.5938 L288.3438,592.8438 L293.6094,592.8438 L293.6094,595 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79.5477" x="303.5" y="594.432">TicketStatus</text><line style="stroke:#181818;stroke-width:0.5;" x1="275.5" x2="385.0477" y1="605" y2="605"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.6478" x="280.5" y="623.9659">VALID</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.9239" x="280.5" y="643.0339">USED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.7417" x="280.5" y="662.1018">CANCELLED</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="81" id="ent0017"><path d="M6,24 L6,87.118 A0,0 0 0 0 6,87.118 L163.5,87.118 L167.5,163.65 L171.5,87.118 L328.7563,87.118 A0,0 0 0 0 328.7563,87.118 L328.7563,34 L318.7563,24 L6,24 A0,0 0 0 0 6,24" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M318.7563,24 L318.7563,34 L328.7563,34 L318.7563,24" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.7563" x="12" y="42.897">version holds an optimistic lock, so the scheduled</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.3982" x="12" y="60.603">finish job and the user never overwrite each</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.1622" x="12" y="78.309">other; the losing write retries on the next run.</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="87" id="ent0020"><path d="M11,749 L11,829.8241 A0,0 0 0 0 11,829.8241 L305.5202,829.8241 A0,0 0 0 0 305.5202,829.8241 L305.5202,759 L295.5202,749 L164.18,749 L162.69,689.06 L156.18,749 L11,749 A0,0 0 0 0 11,749" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M295.5202,749 L295.5202,759 L305.5202,759 L295.5202,749" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.2242" x="17" y="767.897">Stock is read with a pessimistic write lock</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.5202" x="17" y="785.603">during reservation, so concurrent buyers are</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.0031" x="17" y="803.309">serialized on this row.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.0072" x="17" y="821.0151">availableQuantity is the source of truth.</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="94" id="ent0023"><path d="M580.5,405 L580.5,485.8241 A0,0 0 0 0 580.5,485.8241 L852.1272,485.8241 A0,0 0 0 0 852.1272,485.8241 L852.1272,415 L842.1272,405 L706.56,405 L675.28,327.5 L698.56,405 L580.5,405 A0,0 0 0 0 580.5,405" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M842.1272,405 L842.1272,415 L852.1272,415 L842.1272,405" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.6272" x="586.5" y="423.897">PENDING holds stock until reservedUntil;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.7132" x="586.5" y="441.603">expired reservations release it back.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.1602" x="586.5" y="459.309">Invariant: all items in an Order</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.0942" x="586.5" y="477.0151">belong to the same Event.</text></g><g class="entity" data-qualified-name="GMN25" data-source-line="101" id="ent0026"><path d="M341.5,758 L341.5,821.118 A0,0 0 0 0 341.5,821.118 L653.4793,821.118 A0,0 0 0 0 653.4793,821.118 L653.4793,768 L643.4793,758 L500.02,758 L492.25,679.63 L492.02,758 L341.5,758 A0,0 0 0 0 341.5,758" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M643.4793,758 L643.4793,768 L653.4793,768 L643.4793,758" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.9793" x="347.5" y="776.897">Owns its lifecycle (VALID -&gt; USED / CANCELLED).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.5682" x="347.5" y="794.603">Issued by OrderItem but never deleted with it:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.7502" x="347.5" y="812.309">refunds transition to CANCELLED.</text></g><!--reverse link Event to TicketType--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="composition" data-source-line="74" id="lnk11"><path codeLine="74" d="M166.9745,349.0798 C166.6145,415.0798 166.19,493.06 165.86,553.78" fill="none" id="Event-backto-TicketType" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="167.04,337.08,163.0073,343.0581,166.9745,349.0798,171.0072,343.1017,167.04,337.08" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.811" x="121.0682" y="359.4553">1 event</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.6131" x="67.851" y="542.3605">0..* ticketTypes</text></g><!--link User to Order--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="75" id="lnk12"><path codeLine="75" d="M648.5,104.21 C648.5,125.08 648.5,144.09 648.5,167.43" fill="none" id="User-to-Order" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="648.5,173.43,652.5,164.43,648.5,168.43,644.5,164.43,648.5,173.43" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="46.176" x="599.3112" y="126.1875">1 buyer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="65.1041" x="580.1603" y="161.518">0..* orders</text></g><!--reverse link Order to OrderItem--><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" data-link-type="composition" data-source-line="76" id="lnk13"><path codeLine="76" d="M570.6889,336.