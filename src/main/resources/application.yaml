spring:
  application:
    name: SoldOut

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration

  datasource:
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 5

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        serialization-mode: via-dto

  jackson:
    default-property-inclusion: non_null
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never