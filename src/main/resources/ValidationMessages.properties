# Event
event.name.blank=name must not be blank
event.name.required=name is required
event.name.length=name must be at most {max} characters
event.description.blank=description must not be blank
event.description.required=description is required
event.description.length=description must be at most {max} characters
event.startsAt.required=startsAt is required
event.startsAt.future=startsAt must be in the present or future
event.endsAt.required=endsAt is required
event.endsAt.future=endsAt must be in the present or future
event.period.invalid=endsAt must be after startsAt

## Ticket type
ticket-type.name.required=name is required
ticket-type.name.length=name must be at most {max} characters
ticket-type.description.required=description is required
ticket-type.description.length=description must be at most {max} characters
ticket-type.price.required=price is required
ticket-type.price.positive-or-zero=price is required
ticket-type.total-quantity.required=total quantity is required
ticket-type.total-quantity.positive=total quantity is required
